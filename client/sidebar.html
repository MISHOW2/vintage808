<!--
  sidebar.html — paste this <aside> into every account page.
  Each page sets data-tab on the buttons (nav.js handles the rest).
  On mobile each button navigates to its own page.
  On desktop they switch tabs inside account.html.
-->

<aside class="account-sidebar">

  <div class="account-avatar">
    <div class="avatar-circle" id="avatar-initials">--</div>
    <div>
      <div class="avatar-name"  id="avatar-name">Loading…</div>
      <div class="avatar-email" id="avatar-email"></div>
    </div>
  </div>

  <nav class="account-nav">
    <button class="account-nav-item" data-tab="profile">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Profile
    </button>
    <button class="account-nav-item" data-tab="orders">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
      Orders
    </button>
    <button class="account-nav-item" data-tab="addresses">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      Addresses
  </nav>

  <button class="account-logout" id="logout-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Log out
  </button>

</aside>
